[package]
name = "gumbel-mcts-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "ndarray"] }
rand = "0.8"

[features]
default = []
wgpu = ["burn/wgpu"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
